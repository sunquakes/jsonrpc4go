# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main" ]

jobs:

  security-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23', '1.24', '1.25', '1.26', '1.27']
    steps:
    - uses: actions/checkout@v4

    - name: Security Scan with govulncheck (Go ${{ matrix.go-version }})
      # Non-blocking: the patched x/net (v0.60.0) and grpc (v1.83.1) releases
      # require Go >= 1.26, but the module still supports Go 1.23.
      continue-on-error: true
      uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee
      with:
        go-version-input: ${{ matrix.go-version }}
        # Only scan the main module
        go-package: ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23', '1.24', '1.25', '1.26', '1.27']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./test/...

    - name: Vet
      run: go vet ./...

    - name: Static Analysis with golangci-lint
      # The pinned linter is built with Go 1.24 and cannot decode export data
      # from Go 1.26/1.27, so lint runs once on the minimum supported version.
      if: matrix.go-version == '1.23'
      uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84
      with:
        version: latest
        args: --timeout=5m

  fuzz-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23', '1.24', '1.25', '1.26', '1.27']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Fuzz test
      run: |
        go test -fuzz=FuzzParseRequestBody -fuzztime=10s -run=^$ ./test

  mcp-conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build example streamable HTTP server
      run: go build -o /tmp/mcp-example-server ./examples/streamable-http/server

    - name: Start server
      run: |
        /tmp/mcp-example-server -port 3001 -hosts localhost,127.0.0.1 &
        timeout 15 bash -c 'until curl -s -o /dev/null http://127.0.0.1:3001/mcp; do sleep 0.5; done'

    - name: Run MCP conformance suite
      uses: modelcontextprotocol/conformance@v0.1.11
      with:
        mode: server
        url: http://127.0.0.1:3001/mcp
        expected-failures: ./conformance-baseline.yml
